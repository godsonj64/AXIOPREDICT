name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Python backend — syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install flask flask-cors pillow waitress
          pip install -e sybil-source/ --no-deps

      - name: Lint — syntax errors and undefined names
        run: |
          flake8 python_backend/server.py \
            --count \
            --select=E9,F63,F7 \
            --show-source \
            --statistics

      - name: Lint — style warnings (non-blocking)
        run: |
          flake8 python_backend/server.py \
            --count \
            --exit-zero \
            --max-line-length=127 \
            --statistics

      - name: Validate server can be imported
        run: |
          cd python_backend
          python -c "import ast, sys; ast.parse(open('server.py').read()); print('server.py syntax OK')"

  electron-check:
    name: Electron app — structure check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron_app/package-lock.json

      - name: Install dependencies
        working-directory: electron_app
        run: npm ci --ignore-scripts

      - name: Validate package.json
        working-directory: electron_app
        run: node -e "const p = require('./package.json'); console.log('name:', p.name, '| version:', p.version, '| main:', p.main);"

      - name: Check required source files exist
        run: |
          for f in electron_app/src/main.js electron_app/src/preload.js electron_app/src/index.html; do
            [ -f "$f" ] && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done
